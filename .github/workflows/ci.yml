name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARGUS_AUTOLOAD_DOTENV: "false"
      ARGUS_DISABLE_SECRET_RESOLUTION: "true"
      ARGUS_EGRESS_TYPE: "unknown"
      ARGUS_RESIDENTIAL_POLICY: "off"
      # Keep the existing 3.11/3.13 compatibility lanes; pin the 3.12 baseline.
      MISE_PYTHON_VERSION: ${{ matrix.python-version == '3.12' && '3.12.13' || matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install pinned mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.10.2"
          install: false
          env: false
          cache: false

      - name: Trust and install the selected Python
        run: |
          mise trust mise.toml
          mise install
          mise exec -- python --version
          mise exec -- python -c 'import os,sys; expected=os.environ["MISE_PYTHON_VERSION"]; assert sys.version.split()[0] == expected or sys.version.startswith(expected + ".")'

      - name: Install uv
        run: mise exec -- python -m pip install uv==0.11.26

      - name: Sync dependencies
        run: mise run env-sync

      - name: Verify canonical provider fixture attestations
        run: mise run fixture-check

      - name: Run tests
        run: mise run test

  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARGUS_AUTOLOAD_DOTENV: "false"
      ARGUS_DISABLE_SECRET_RESOLUTION: "true"
      ARGUS_EGRESS_TYPE: "unknown"
      ARGUS_RESIDENTIAL_POLICY: "off"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install pinned mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.10.2"
          install: false
          env: false
          cache: false

      - name: Trust and install the selected Python
        run: |
          mise trust mise.toml
          mise install
          mise exec -- python --version

      - name: Install uv
        run: mise exec -- python -m pip install uv==0.11.26

      - name: Sync dependencies
        run: mise run env-sync

      - name: Run hermetic scorecard
        run: mise run scorecard

      - name: Upload hermetic scorecard bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-hermetic
          path: .artifacts/scorecard-hermetic
          if-no-files-found: error

  postgres-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: argus_restore_ci_authority
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d argus_restore_ci_authority"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARGUS_AUTOLOAD_DOTENV: "false"
      ARGUS_DISABLE_SECRET_RESOLUTION: "true"
      ARGUS_EGRESS_TYPE: "unknown"
      ARGUS_RESIDENTIAL_POLICY: "off"
      ARGUS_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/argus_restore_ci_authority
      ARGUS_TEST_ALLOW_PROVISIONING: disposable-only
      ARGUS_TEST_PSQL: /usr/bin/psql
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install pinned mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.10.2"
          install: false
          env: false
          cache: false

      - name: Trust and install the selected Python
        run: |
          mise trust mise.toml
          mise install
          mise exec -- python --version

      - name: Install uv
        run: mise exec -- python -m pip install uv==0.11.26

      - name: Sync dependencies
        run: mise run env-sync

      - name: Verify canonical provider fixture attestations
        run: mise run fixture-check

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          test -x "$ARGUS_TEST_PSQL"
          "$ARGUS_TEST_PSQL" --version

      - name: Migrate PostgreSQL schema
        run: |
          ARGUS_DB_URL="$ARGUS_TEST_POSTGRES_URL" \
            mise exec -- uv run --frozen alembic upgrade head

      - name: Verify PostgreSQL schema contract
        id: schema
        run: |
          SCHEMA_HEAD="$(mise exec -- uv run --frozen python -c 'from argus.recovery.database import EXPECTED_SCHEMA_HEAD; print(EXPECTED_SCHEMA_HEAD)')"
          mise exec -- uv run --frozen \
            python scripts/generate_argus_schema_contract.py \
            --database-url "$ARGUS_TEST_POSTGRES_URL" \
            --schema-head "$SCHEMA_HEAD" \
            --check
          echo "schema_head=$SCHEMA_HEAD" >> "$GITHUB_OUTPUT"
          SCHEMA_CONTRACT_NAME="$(mise exec -- uv run --frozen python -c 'from argus.recovery.database import EXPECTED_SCHEMA_HEAD, SCHEMA_CONTRACT_PATHS; print(SCHEMA_CONTRACT_PATHS[EXPECTED_SCHEMA_HEAD].name)')"
          echo "schema_contract=argus/recovery/$SCHEMA_CONTRACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload PostgreSQL schema contract
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: argus-schema-${{ steps.schema.outputs.schema_head }}
          path: ${{ steps.schema.outputs.schema_contract }}
          if-no-files-found: error

      - name: Run PostgreSQL ledger contract
        run: mise run postgres-test

      - name: Verify PostgreSQL provider-readiness authority
        run: |
          mkdir -p artifacts
          mise exec -- uv run --frozen \
            python scripts/verify_provider_readiness_postgres.py \
            --output artifacts/provider-readiness-postgres.json

      - name: Upload PostgreSQL provider-readiness evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-readiness-postgres
          path: artifacts/provider-readiness-postgres.json
          if-no-files-found: error

  production-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARGUS_AUTOLOAD_DOTENV: "false"
      ARGUS_DISABLE_SECRET_RESOLUTION: "true"
      ARGUS_ENV: production
      ARGUS_EGRESS_TYPE: datacenter
      ARGUS_RESIDENTIAL_POLICY: fallback
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install pinned mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.10.2"
          install: false
          env: false
          cache: false

      - name: Trust and install the selected Python
        run: |
          mise trust mise.toml
          mise install
          mise exec -- python --version

      - name: Install uv
        run: mise exec -- python -m pip install uv==0.11.26

      - name: Sync frozen production dependencies
        run: mise run env-sync

      - name: Verify production-like configuration
        run: mise run production-config

  image-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build production image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: false
          load: true
          tags: argus-browser-canary:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}

      - name: Run 1 GiB browser admission canary
        run: |
          docker run --rm --init \
            --network none \
            --memory 1g --memory-swap 1g --pids-limit 256 --shm-size 256m \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --security-opt no-new-privileges:true \
            --security-opt seccomp=./docker/playwright-seccomp.json \
            --volume "$PWD/scripts/browser_canary.py:/canary/browser_canary.py:ro" \
            "argus-browser-canary:${{ github.sha }}" \
            python /canary/browser_canary.py --memory-limit-mib 1024

      - name: Run 512 MiB missing-browser regression
        run: |
          docker run --rm --init \
            --network none \
            --memory 512m --memory-swap 512m --pids-limit 256 --shm-size 128m \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --tmpfs /ms-playwright:rw,noexec,nosuid,size=1m \
            --security-opt no-new-privileges:true \
            --security-opt seccomp=./docker/playwright-seccomp.json \
            --volume "$PWD/scripts/browser_canary.py:/canary/browser_canary.py:ro" \
            "argus-browser-canary:${{ github.sha }}" \
            python /canary/browser_canary.py \
              --expect-missing --memory-limit-mib 512

  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install pinned mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.10.2"
          install: false
          env: false
          cache: false

      - name: Trust and install the selected Python
        run: |
          mise trust mise.toml
          mise install
          mise exec -- python --version

      - name: Install uv
        run: mise exec -- python3 -m pip install uv==0.11.26

      - name: Sync release dependencies
        run: mise exec -- uv sync --frozen

      - name: Check llms.txt freshness
        run: |
          README_TS=$(git log -1 --format=%ct -- README.md)
          LLMS_TS=$(git log -1 --format=%ct -- llms.txt)
          LLMSFULL_TS=$(git log -1 --format=%ct -- llms-full.txt)

          if [ "$LLMS_TS" -lt "$README_TS" ] || [ "$LLMSFULL_TS" -lt "$README_TS" ]; then
            echo "::warning::llms.txt or llms-full.txt is older than README.md — update them before release"
          fi

      - name: Check version sync
        run: mise exec -- uv run --frozen --no-sync python scripts/verify_release_contract.py
