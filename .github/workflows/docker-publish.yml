name: Build and Promote Immutable Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: khamel83/argus

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      receipt_sha256: ${{ steps.receipt.outputs.sha256 }}
      source_revision: ${{ steps.identity.outputs.source_revision }}
      runtime_manifest_sha256: ${{ steps.receipt.outputs.runtime_manifest_sha256 }}
      release_descriptor_sha256: ${{ steps.receipt.outputs.release_descriptor_sha256 }}
      schema_contract_sha256: ${{ steps.receipt.outputs.schema_contract_sha256 }}
      schema_id: ${{ steps.receipt.outputs.schema_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Resolve source commit
        id: identity
        run: echo "source_revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          build-args: VCS_REF=${{ steps.identity.outputs.source_revision }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.identity.outputs.source_revision }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract immutable release inputs
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
          container_id="$(docker create "$IMAGE_REF")"
          cleanup() {
            docker rm "$container_id" >/dev/null
          }
          trap cleanup EXIT
          docker cp "$container_id:/app/runtime-manifest.json" runtime-manifest.json
          docker cp "$container_id:/app/argus/mcp/release_descriptor.json" release_descriptor.json
          schema_contract_file="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["schema_contract_file"])' runtime-manifest.json)"
          case "$schema_contract_file" in
            argus/recovery/argus_schema_*.json) ;;
            *) echo "runtime manifest schema contract path is invalid" >&2; exit 1 ;;
          esac
          docker cp "$container_id:/app/${schema_contract_file}" schema-contract.json

      - name: Write release receipt
        id: receipt
        run: |
          python scripts/write_release_receipt.py \
            --image "${REGISTRY}/${IMAGE_NAME}" \
            --digest "${{ steps.build.outputs.digest }}" \
            --source-revision "${{ steps.identity.outputs.source_revision }}" \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow "${GITHUB_WORKFLOW}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --runtime-manifest runtime-manifest.json \
            --release-descriptor release_descriptor.json \
            --schema-contract schema-contract.json \
            --output release-receipt.json
          echo "sha256=$(sha256sum release-receipt.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "runtime_manifest_sha256=$(sha256sum runtime-manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "release_descriptor_sha256=$(sha256sum release_descriptor.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "schema_contract_sha256=$(sha256sum schema-contract.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "schema_id=$(python3 -c 'import json; print(json.load(open("release-receipt.json", encoding="utf-8"))["schema_id"])')" >> "$GITHUB_OUTPUT"

      - name: Retain release receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-receipt
          path: |
            release-receipt.json
            runtime-manifest.json
            release_descriptor.json
            schema-contract.json
          if-no-files-found: error
          retention-days: 90

  promote:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    if: github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: argus-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Join deployment tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:argus-deployer
          ping: homelab

      - name: Submit forced-command promotion
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
          SOURCE_REVISION: ${{ needs.build.outputs.source_revision }}
          RECEIPT_SHA256: ${{ needs.build.outputs.receipt_sha256 }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          install -m 0600 /dev/null "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          promotion_status=255
          transport_failures=0
          for attempt in {1..60}; do
            set +e
            ssh -i "$RUNNER_TEMP/ssh/deploy_key" \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              -o ConnectionAttempts=1 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
              -o HostKeyAlias=homelab-ts \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -o TCPKeepAlive=yes \
              "argus-deploy@homelab.deer-panga.ts.net" \
              "argus-deploy promote ${IMAGE_REF} ${SOURCE_REVISION} ${RECEIPT_SHA256}"
            promotion_status=$?
            set -e
            case "$promotion_status" in
              0)
                exit 0
                ;;
              75)
                transport_failures=0
                if [[ "$attempt" -lt 60 ]]; then
                  sleep 30
                fi
                ;;
              255)
                transport_failures=$((transport_failures + 1))
                if [[ "$transport_failures" -ge 5 ]]; then
                  exit 255
                fi
                if [[ "$attempt" -lt 60 ]]; then
                  sleep 30
                fi
                ;;
              *)
                exit "$promotion_status"
                ;;
            esac
          done
          exit "$promotion_status"
