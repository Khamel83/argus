name: Live scorecard configuration (diagnostic-only)

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-live-configuration-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.26
      - name: Sync frozen dependencies
        run: uv sync --frozen --python 3.12
      - name: Generate scheduled-free and scorecard-budgeted P1 configuration
        run: >-
          uv run python scripts/run-scorecard.py
          --lane live-config
          --output .artifacts/live/config.json
      - name: Publish configuration for Task 16 P1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-live-configuration-${{ github.run_id }}
          path: .artifacts/live/config.json
          if-no-files-found: error

# Task 16/P1 is the only owner of live execution and protected promotion.
